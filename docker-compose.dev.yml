# Development overlay: live code from the host and auto-reload.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  api:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./apps/api/app:/app/app:ro
      - ./apps/api/migrations:/app/migrations:ro

  worker:
    # Restart the worker when its code changes (watchfiles ships with uvicorn[standard]).
    command: ["watchfiles", "--filter", "python", "python -m app.worker", "/app/app"]
    volumes:
      - ./apps/api/app:/app/app:ro
      - ./apps/api/migrations:/app/migrations:ro
